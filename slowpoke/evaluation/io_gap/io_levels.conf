# I/O-gap experiment matrix (Phase 3) — thesis-aligned design.
# L0/L1/L2 use the SAME -x target as Phase 1; L1/L2 add path I/O via netem sidecars.
#
# Level | Meaning
# L0    | Standard run-*-medium.sh (Phase 1 baseline)
# L1    | Same target + moderate sync I/O on downstream path services
# L2    | Same target + heavier sync I/O on downstream path services

# Fixed causal targets (identical to L0 / Fig. 8)
IO_BOUTIQUE_L0_TARGET=cart
IO_BOUTIQUE_L1_TARGET=cart
IO_BOUTIQUE_L2_TARGET=cart

IO_HOTEL_L0_TARGET=profile
IO_HOTEL_L1_TARGET=profile
IO_HOTEL_L2_TARGET=profile

IO_SOCIAL_L0_TARGET=hometimeline
IO_SOCIAL_L1_TARGET=hometimeline
IO_SOCIAL_L2_TARGET=hometimeline

IO_MOVIE_L0_TARGET=moviereviews
IO_MOVIE_L1_TARGET=moviereviews
IO_MOVIE_L2_TARGET=moviereviews

# Netem injection: "service:delay_ms" pairs (downstream path I/O, not -x change)
# cart path: product_catalog (~61% request share) not shipping (~10%)
IO_BOUTIQUE_L1_INJECT=productcatalog:30
IO_BOUTIQUE_L2_INJECT=productcatalog:50,currency:30

IO_HOTEL_L1_INJECT=rate:30
IO_HOTEL_L2_INJECT=rate:50,user:30

IO_SOCIAL_L1_INJECT=poststorage:30
IO_SOCIAL_L2_INJECT=poststorage:50,socialgraph:30

IO_MOVIE_L1_INJECT=reviewstorage:30
IO_MOVIE_L2_INJECT=reviewstorage:50,movieinfo:30

# Shared medium wrk parameters (match run-*-medium.sh)
IO_THREAD=8
IO_CONN=1024
IO_REPETITIONS=1
# L1/L2 injection drops throughput to ~10-50 req/s; large num_req causes the
# per-thread counter to be unreachable before wrk times out (600s cap).
# At worst-case 10 req/s total / 8 threads = 1.25 req/s per thread.
# num_req=800 → 100 per thread → reachable in ~80s. Still enough for RMSE.
IO_NUM_REQ_BOUTIQUE=800
IO_NUM_REQ_HOTEL=800
IO_NUM_REQ_SOCIAL=800
IO_NUM_REQ_MOVIE=800
IO_POKER_BATCH_REQ=100
IO_NUM_EXP=10

# Per-app connection overrides for NetPoke L1/L2 runs.
# Hotel/social/movie actual-test throughput collapses to ~2-7 req/s under
# combined SIGSTOP+egress-hold+netem — 1024 conns at 2 req/s means each
# connection gets a request every ~8 min; fix_req_n.lua never fires.
# 32 conns keeps utilisation sane at low throughput while still stressing
# the service enough to measure the I/O gap.
IO_CONN_HOTEL=32
IO_CONN_SOCIAL=32
IO_CONN_MOVIE=32
# Boutique runs at ~1600 req/s even under L1/L2 — 32 conns starves it.
# Leave boutique at the default IO_CONN=1024.

# Per-app num_req overrides for NetPoke L1/L2 runs.
# At ~6-7 req/s total / 8 threads = ~0.8 req/s per thread, counter=100
# is reachable in ~125s which is well within the 600s duration cap.
# IO_NUM_REQ_NETPOKE is intentionally not set — use the same IO_NUM_REQ_*
# values as SIGSTOP runs (800) so measurements are comparable.
