# I/O-gap experiment matrix (Phase 3) — thesis-aligned design.
# L0/L1/L2 use the SAME -x target as Phase 1; L1/L2 add path I/O via netem sidecars.
#
# Level | Meaning
# L0    | Standard run-*-medium.sh (Phase 1 baseline)
# L1    | Same target + moderate sync I/O on downstream path services
# L2    | Same target + heavier sync I/O on downstream path services

# Fixed causal targets (identical to L0 / Fig. 8)
IO_BOUTIQUE_L0_TARGET=cart
IO_BOUTIQUE_L1_TARGET=cart
IO_BOUTIQUE_L2_TARGET=cart

IO_HOTEL_L0_TARGET=profile
IO_HOTEL_L1_TARGET=profile
IO_HOTEL_L2_TARGET=profile

IO_SOCIAL_L0_TARGET=hometimeline
IO_SOCIAL_L1_TARGET=hometimeline
IO_SOCIAL_L2_TARGET=hometimeline

IO_MOVIE_L0_TARGET=moviereviews
IO_MOVIE_L1_TARGET=moviereviews
IO_MOVIE_L2_TARGET=moviereviews

# Netem injection: "service:delay_ms" pairs (downstream path I/O, not -x change)
IO_BOUTIQUE_L1_INJECT=shipping:30
IO_BOUTIQUE_L2_INJECT=shipping:50

IO_HOTEL_L1_INJECT=rate:30
IO_HOTEL_L2_INJECT=rate:50,user:30

IO_SOCIAL_L1_INJECT=poststorage:30
IO_SOCIAL_L2_INJECT=poststorage:50,socialgraph:30

IO_MOVIE_L1_INJECT=reviewstorage:30
IO_MOVIE_L2_INJECT=reviewstorage:50,movieinfo:30

# Shared medium wrk parameters (match run-*-medium.sh)
IO_THREAD=8
IO_CONN=1024
IO_REPETITIONS=1
IO_NUM_REQ_BOUTIQUE=100000
IO_NUM_REQ_HOTEL=10000
IO_NUM_REQ_SOCIAL=100000
# Match run-movie-medium.sh (100000 caused zero-throughput retry loops on movie L1)
IO_NUM_REQ_MOVIE=20000
IO_POKER_BATCH_REQ=100
IO_NUM_EXP=10
